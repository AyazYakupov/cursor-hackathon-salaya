<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17231d">
  <title>Care Companion · Live Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #17231d;
      --paper: #fffdf7;
      --ground: #e8e3d8;
      --leaf: #62c58c;
      --sun: #f1c96a;
      --line: rgba(255, 255, 255, .13);
      --ease: cubic-bezier(.16, 1, .3, 1);
      font-family: "Avenir Next", Avenir, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: white;
    }

    button, a { font: inherit; }

    :is(button, a):focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 3px;
    }

    .launcher {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100dvh;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 72px;
      padding: 12px clamp(14px, 2.5vw, 30px);
      border-bottom: 1px solid var(--line);
      background: #17231d;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .mark {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #294e3a;
      color: var(--sun);
    }

    .mark svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .brand-copy strong, .brand-copy span { display: block; }
    .brand-copy strong { font-size: .95rem; letter-spacing: -.02em; }
    .brand-copy span { margin-top: 2px; color: #aebdb3; font-size: .68rem; }

    .toolbar-actions { display: flex; align-items: center; gap: 8px; }

    .view-switch {
      display: inline-flex;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
    }

    .view-button {
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #b8c7bd;
      font-size: .7rem;
      font-weight: 800;
      cursor: pointer;
    }

    .view-button.is-active { background: var(--paper); color: var(--ink); }

    .open-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: white;
      text-decoration: none;
      font-size: .7rem;
      font-weight: 800;
      transition: background .2s ease, transform .2s var(--ease);
    }

    .open-link:hover { background: rgba(255, 255, 255, .09); transform: translateY(-1px); }
    .open-link svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }

    .preview-grid {
      display: grid;
      grid-template-columns: minmax(360px, .88fr) minmax(520px, 1.12fr);
      min-height: 0;
      gap: 1px;
      background: #38463d;
    }

    .preview {
      display: grid;
      grid-template-rows: 40px 1fr;
      min-width: 0;
      min-height: 0;
      background: var(--paper);
    }

    .preview-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      background: #233229;
      color: #d8e2db;
      font-size: .7rem;
      font-weight: 800;
    }

    .preview-label span:last-child { display: inline-flex; align-items: center; gap: 7px; color: #91dfae; }
    .preview-label i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: livePulse 2.2s ease-in-out infinite; }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: var(--paper);
    }

    .preview-grid[data-view="receiver"] { grid-template-columns: 1fr; }
    .preview-grid[data-view="receiver"] .preview.caretaker { display: none; }
    .preview-grid[data-view="caretaker"] { grid-template-columns: 1fr; }
    .preview-grid[data-view="caretaker"] .preview.receiver { display: none; }

    @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .42; } }

    @media (max-width: 860px) {
      .toolbar { min-height: 64px; }
      .brand-copy span, .open-link span { display: none; }
      .open-link { width: 40px; padding: 0; justify-content: center; }
      .preview-grid { grid-template-columns: 1fr; }
      .preview-grid[data-view="split"] .preview.caretaker { display: none; }
      .view-switch .view-button[data-view="split"] { display: none; }
      .view-switch .view-button[data-view="receiver"] { background: var(--paper); color: var(--ink); }
      .view-switch .view-button[data-view="caretaker"] { background: transparent; color: #b8c7bd; }
      .view-switch[data-mobile-view="caretaker"] .view-button[data-view="receiver"] { background: transparent; color: #b8c7bd; }
      .view-switch[data-mobile-view="caretaker"] .view-button[data-view="caretaker"] { background: var(--paper); color: var(--ink); }
      .preview-grid[data-view="caretaker"] .preview.caretaker { display: grid; }
    }

    @media (max-width: 470px) {
      .toolbar { gap: 8px; padding-inline: 10px; }
      .brand { gap: 8px; }
      .mark { width: 36px; height: 36px; }
      .brand-copy strong { font-size: .78rem; }
      .view-button { padding-inline: 9px; }
      .toolbar-actions { gap: 5px; }
      .open-link:first-of-type { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!--
    THESIS: The demo is one connected household shown simultaneously, not a menu of disconnected mockups.
    OWN-WORLD: Ink-green demo chrome, paper-white previews, live leaf signals, and compact rounded navigation.
    STORY: The presenter opens one URL, sees both roles, triggers care from the right, and watches Grandma respond on the left.
    FIRST VIEWPORT: A slim launcher toolbar sits above a full-height receiver and caretaker split preview with direct-open links.
    FORM: Family Daybook, assigned direction 6, seed 72401c94.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <main class="launcher">
    <header class="toolbar">
      <div class="brand">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5c3.5-6.3 10.5-6.3 14 0-3.5 6.3-10.5 6.3-14 0Z"></path><path d="M12 9.4v10.1M8.7 13.8 12 17l3.3-3.2"></path></svg></div>
        <div class="brand-copy"><strong>Care Companion</strong><span>Live two-screen demo</span></div>
      </div>

      <div class="toolbar-actions">
        <div class="view-switch" id="viewSwitch" role="group" aria-label="Preview layout">
          <button class="view-button is-active" type="button" data-view="split">Split</button>
          <button class="view-button" type="button" data-view="receiver">Grandma</button>
          <button class="view-button" type="button" data-view="caretaker">Caretaker</button>
        </div>
        <a class="open-link" href="carereceiver.html" target="_blank" rel="noopener"><span>Open Grandma</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path></svg></a>
        <a class="open-link" href="caretaker.html" target="_blank" rel="noopener"><span>Open Caretaker</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path></svg></a>
      </div>
    </header>

    <section class="preview-grid" id="previewGrid" data-view="split" aria-label="Care Companion split preview">
      <article class="preview receiver">
        <header class="preview-label"><span>Grandma · Ambient frame</span><span><i aria-hidden="true"></i>Live receiver</span></header>
        <iframe src="carereceiver.html" title="Grandma's digital photo frame"></iframe>
      </article>
      <article class="preview caretaker">
        <header class="preview-label"><span>Family · Caretaker hub</span><span><i aria-hidden="true"></i>Live controller</span></header>
        <iframe src="caretaker.html" title="Family caretaker hub"></iframe>
      </article>
    </section>
  </main>

  <script>
    (() => {
      const grid = document.getElementById('previewGrid');
      const switcher = document.getElementById('viewSwitch');
      const buttons = [...document.querySelectorAll('.view-button')];

      function setView(view) {
        const narrow = window.matchMedia('(max-width: 860px)').matches;
        const resolved = narrow && view === 'split' ? 'receiver' : view;
        grid.dataset.view = resolved;
        switcher.dataset.mobileView = resolved;
        buttons.forEach((button) => button.classList.toggle('is-active', button.dataset.view === (narrow && view === 'split' ? 'receiver' : view)));
      }

      buttons.forEach((button) => button.addEventListener('click', () => setView(button.dataset.view)));
      window.matchMedia('(max-width: 860px)').addEventListener('change', (event) => setView(event.matches ? 'receiver' : 'split'));
    })();
  </script>
</body>
</html>
