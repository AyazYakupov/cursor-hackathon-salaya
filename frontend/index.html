<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Companion — Live Split Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: #1e293b;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #334155;
  }
  .title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .links { display: flex; gap: 12px; }
  .btn {
    background: #3b82f6;
    color: white;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .btn:hover { background: #2563eb; }
  .btn.secondary { background: #334155; }
  .btn.secondary:hover { background: #475569; }
  .split-container {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: #334155;
  }
  .pane {
    display: flex;
    flex-direction: column;
    background: #000;
    position: relative;
  }
  .pane-header {
    background: #1e293b;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    border-bottom: 1px solid #334155;
    display: flex;
    justify-content: space-between;
  }
  iframe {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }
</style>
</head>
<body>
<header>
  <div class="title">🌿 Care Companion — Live Interactive Demo</div>
  <div class="links">
    <a class="btn secondary" href="carereceiver.html" target="_blank">Open Frame Tab ↗</a>
    <a class="btn" href="caretaker.html" target="_blank">Open Caretaker Tab ↗</a>
  </div>
</header>
<div class="split-container">
  <div class="pane">
    <div class="pane-header">
      <span>📱 Carereceiver (Grandma's Ambient Frame)</span>
      <span style="color: #4ade80;">● Live Receiver</span>
    </div>
    <iframe src="carereceiver.html"></iframe>
  </div>
  <div class="pane">
    <div class="pane-header">
      <span>💻 Caretaker (Family Hub & AI)</span>
      <span style="color: #38bdf8;">● Live Controller</span>
    </div>
    <iframe src="caretaker.html"></iframe>
  </div>
</div>
</body>
</html>
